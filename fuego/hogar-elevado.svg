<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <!-- Hogar elevado (altar de fuego): dibujo propio para el recetario, sin licencia de terceros -->
  <ellipse cx="160" cy="206" rx="140" ry="10" fill="#d9cdbb"/>
  <!-- patas -->
  <g fill="#a4743f" stroke="#6d4a26" stroke-width="2">
    <rect x="58" y="96" width="12" height="110" rx="3"/>
    <rect x="250" y="96" width="12" height="110" rx="3"/>
    <rect x="92" y="88" width="10" height="104" rx="3" opacity=".8"/>
    <rect x="218" y="88" width="10" height="104" rx="3" opacity=".8"/>
  </g>
  <!-- travesaños con amarre -->
  <g fill="#b9844b" stroke="#6d4a26" stroke-width="2">
    <rect x="46" y="150" width="228" height="9" rx="4"/>
  </g>
  <g stroke="#e8dcc0" stroke-width="2"><path d="M60 148v13M66 148v13M252 148v13M258 148v13"/></g>
  <!-- plataforma de palos -->
  <g fill="#c08a50" stroke="#6d4a26" stroke-width="1.5">
    <rect x="40" y="112" width="240" height="10" rx="5"/>
    <rect x="40" y="102" width="240" height="10" rx="5"/>
  </g>
  <!-- capa de barro con borde de troncos -->
  <rect x="48" y="84" width="224" height="20" fill="#9b6b45"/>
  <g fill="#9a6a38" stroke="#6d4a26" stroke-width="1.5">
    <rect x="44" y="78" width="12" height="26" rx="5"/>
    <rect x="264" y="78" width="12" height="26" rx="5"/>
  </g>
  <rect x="56" y="80" width="208" height="6" fill="#b98458"/>
  <!-- leños del fuego -->
  <g fill="#7a5230" stroke="#4d321a" stroke-width="1.5">
    <rect x="112" y="68" width="96" height="11" rx="5" transform="rotate(-8 160 74)"/>
    <rect x="112" y="68" width="96" height="11" rx="5" transform="rotate(8 160 74)"/>
  </g>
  <!-- llamas -->
  <path d="M160 18c10 18 26 26 22 44-2 10-12 14-22 14s-20-4-22-14c-3-14 8-20 12-30 3 10 8 12 10 4z" fill="#f6a623"/>
  <path d="M160 40c6 10 14 14 11 25-2 6-7 8-11 8s-9-2-11-8c-2-8 4-12 7-18 1 6 4 6 4-7z" fill="#ffd34e"/>
  <!-- olla apoyada en dos troncos -->
  <g fill="#9aa3ab" stroke="#4f565c" stroke-width="2">
    <rect x="196" y="40" width="44" height="30" rx="4"/>
    <rect x="192" y="36" width="52" height="7" rx="3"/>
  </g>
  <path d="M206 30q12-12 24 0" fill="none" stroke="#c8ced3" stroke-width="3" stroke-linecap="round"/>
</svg>
